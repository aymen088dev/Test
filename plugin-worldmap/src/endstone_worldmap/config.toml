# ------------------------------------------------------------------
# URL de base de ton serveur Node.js (la carte)
# ------------------------------------------------------------------
endpoint = "http://151.240.30.8:10015"

# Cle d'API partagee : elle doit etre IDENTIQUE a MAP_API_KEY sur le
# serveur Node.js. Vide = aucune authentification.
api_key = "changh"

# ------------------------------------------------------------------
# Zone a scanner
# ------------------------------------------------------------------
# IMPORTANT : le serveur Bedrock ne charge en memoire que les chunks qui
# entourent les joueurs connectes (view-distance du serveur). Le plugin ne
# scanne donc QUE ces chunks-la, centres sur la position des joueurs.
# Il faut au moins un joueur connecte pour que la carte avance.
#
# Centre impose (facultatif). Si center_x = center_z = 0 (defaut), le
# plugin suit les joueurs connectes.
center_x = 0
center_z = 0

# Rayon maximal autour de chaque joueur, en CHUNKS.
#   0 = pas de limite (tout ce qui est charge)
#   8 = uniquement les chunks a moins de 128 blocs du joueur
radius_chunks = 0

# Dimensions a scanner : "overworld", "nether", "the_end"
dimensions = ["overworld"]

# ------------------------------------------------------------------
# Performances
# ------------------------------------------------------------------
# Blocs solides conserves par colonne.
#   1 = simple heightmap (colonne pleine couleur)
#   4 = + parois colorees (cote des falaises / BlueMap)
depth = 4

# Chunks traites par TICK (20 ticks = 1 seconde).
# Baisse si le serveur rame pendant le scan.
chunks_per_tick = 2

# Pause (ms) entre deux envois HTTP (evite de saturer le reseau)
send_delay_ms = 50

# Lancer UN scan au demarrage (peu utile : aucun joueur n'est encore
# connecte). Le suivi ci-dessous est prevu pour ca.
auto_scan = false

# Suivre les joueurs en continu : chaque nouvelle zone exploree est pushed
# vers la carte toutes les follow_interval_seconds secondes.
auto_follow = true

# Pause (en secondes) entre deux passages du suivi
follow_interval_seconds = 10
