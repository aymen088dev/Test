[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-worldmap"
version = "0.1.0"
description = "Scanne le monde et envoie la carte en direct au serveur Node.js (carte isometrique)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing_extensions>=4.0"]
keywords = ["endstone", "plugin", "map", "bedrock"]

[project.entry-points."endstone"]
worldmap = "endstone_worldmap:WorldMapPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_worldmap"]
