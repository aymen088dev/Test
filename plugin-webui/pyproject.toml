[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-webui"
version = "0.1.0"
description = "Menu in-game + tableau de bord web (HTML/CSS/JS) pour serveurs Endstone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typing_extensions>=4.0"]
keywords = ["endstone", "plugin", "webui", "bedrock"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.entry-points."endstone"]
webui = "endstone_webui:WebUIPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_webui"]
